<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet"><title>Create account · MENTRA</title></head>
<body data-public>
<div class="auth-wrap">
  <section class="auth-side">
    <a class="brand text-white" href="/"><span class="brand-mark"><svg viewBox="0 0 64 64"><path d="M16 46V19l16 17 16-17v27" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>mentra</a>
    <div><h2>Your next breakthrough starts with one conversation.</h2><p class="opacity-75 fs-5 mt-3 position-relative">Students find guidance. Mentors share what they know. Everyone grows.</p></div>
    <small class="opacity-75 position-relative">Free for students and mentors</small>
  </section>
  <main class="auth-main"><div class="auth-card">
    <h1 class="h2 mb-1">Create your account</h1><p class="text-muted-m mb-4">Choose how you want to use MENTRA.</p>
    <form id="authForm" data-mode="register" novalidate>
      <div class="role-pick mb-3">
        <div><input type="radio" name="role" id="r-mentee" value="mentee" checked><label for="r-mentee"><i class="bi bi-mortarboard"></i>I'm a student<small>Find a mentor</small></label></div>
        <div><input type="radio" name="role" id="r-mentor" value="mentor"><label for="r-mentor"><i class="bi bi-lightbulb"></i>I'm a mentor<small>Guide students</small></label></div>
      </div>
      <div class="mb-3"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" autocomplete="name" maxlength="80" required></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><div class="form-text">At least 8 characters.</div></div>
      <button class="btn btn-primary w-100 py-2" type="submit">Create account</button>
    </form>
    <p class="text-center text-muted-m mt-4 mb-0">Already have an account? <a href="/pages/login.html" class="fw-bold text-decoration-none">Log in</a></p>
  </div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script><script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
</body></html>
